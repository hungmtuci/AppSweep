name: Build & Publish macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag phiên bản cần phát hành (ví dụ: v1.2.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Universal macOS App (.dmg & .zip)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract semantic version from tag
        id: meta
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"

      - name: Build AppSweep Universal Binary & Installer Packages
        env:
          APPSWEEP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x build_appsweep.sh
          ./build_appsweep.sh
          ls -lh dist/

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.raw_tag }}
          name: "AppSweep v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/AppSweep-Installer-v${{ steps.meta.outputs.version }}.dmg
            dist/AppSweep-v${{ steps.meta.outputs.version }}-macOS.zip
